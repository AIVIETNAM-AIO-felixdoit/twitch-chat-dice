<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Dice Overlay</title>
  <style>
    :root { --bg: transparent; --fg: #fff; --accent: #9146ff; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
    }
    .card {
      display: inline-block;
      margin: 16px;
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      border-left: 6px solid var(--accent);
      max-width: 90vw;
    }
    .user { font-weight: 700; color: var(--accent); }
    .text { font-size: 22px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="user" id="user">Chat</div>
    <div class="text" id="text">Waiting for !roll...</div>
  </div>
  <script>
    async function refresh() {
      try {
        const res = await fetch("/state", { cache: "no-store" });
        const state = await res.json();
        document.getElementById("user").textContent = state.user ? "@" + state.user : "Chat";
        document.getElementById("text").textContent = state.text;
      } catch (err) {
        // Keep the last value on screen if the bot is restarting.
      }
    }
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
